<!DOCTYPE html>
<html>
<head>
    <title>ShopAssist AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eef3ff;
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🔵 Header */
        .header {
            background: #1e3a8a;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #eef3ff;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        .bubble {
            display: inline-block;
            padding: 10px;
            border-radius: 10px;
            max-width: 60%;
        }

        /* 🔵 User bubble */
        .user .bubble {
            background: #3b82f6;
            color: white;
        }

        /* ⚪ Bot bubble */
        .bot .bubble {
            background: #ffffff;
            color: black;
        }

        /* 🔵 Input area */
        .input-area {
            display: flex;
            padding: 10px;
            background: #e0e7ff;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            outline: none;
        }

        /* 🔵 Send button */
        .send-btn {
            background: #1e3a8a;
            color: white;
            border: none;
            margin-left: 10px;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .send-btn:hover {
            background: #0f1f5c;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="header">🤖 ShopAssist AI</div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type message...">
        <button onclick="send()" class="send-btn">➤</button>
    </div>
</div>

<script>
function send() {
    let input = document.getElementById("userInput").value;

    if(input.trim() === "") return;

    fetch("/get", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "msg=" + input
    })
    .then(res => res.json())
    .then(data => {
        let msgBox = document.getElementById("messages");

        msgBox.innerHTML += `
            <div class="user"><div class="bubble">${input}</div></div>
            <div class="bot"><div class="bubble">${data.reply}</div></div>
        `;

        document.getElementById("userInput").value = "";
        msgBox.scrollTop = msgBox.scrollHeight;
    });
}

/* 🔥 Enter key support */
document.getElementById("userInput")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
